<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Supplier Panel</title>
<style>
body{font-family:Arial;background:#f2f2f2;padding:15px;margin:0}
h1{text-align:center}
.card{background:#fff;padding:15px;margin:0 auto 12px;max-width:500px;border-radius:12px}
button{padding:10px 18px;border:0;border-radius:8px;background:#111;color:#fff}
select{padding:8px;border-radius:8px;width:100%;margin-top:8px}
</style></head>
<body>
<h1>Supplier Orders</h1>
<div style="text-align:center;margin-bottom:15px"><button onclick="load()">🔄 Refresh</button></div>
<div id="list">Loading...</div>
<script>
const API = "https://script.google.com/macros/s/AKfycbx6w9RD4YyJOvwUYm54TeKtGypOIHmoalOJFoADkIWs2iJwImCZgnhmdMfSo3u72UhGCw/exec";
async function load(){
  document.getElementById("list").innerHTML = "Loading...";
  let res = await fetch(API);
  let orders = await res.json();
  let html = "";
  orders.reverse().forEach(o=>{
    html += `<div class="card"><h2>${o.product}</h2><p>Qty: ${o.qty} | Size: ${o.size} | Color: ${o.color}</p><p><b>${o.name}</b> - ${o.phone}</p><p>${o.city} - ${o.address}</p><p>Status: ${o.status}</p><select onchange="updateStatus('${o.phone}','${o.product}',this.value)"><option value="">Status Change Karo...</option><option>Pending</option><option>Shipped</option><option>Delivered</option><option>Cancelled</option></select></div>`;
  });
  document.getElementById("list").innerHTML = html || "Koi order nahi";
}
async function updateStatus(phone, product, status){
  if(!status) return;
  await fetch(API,{method:"POST",mode:"no-cors",body:JSON.stringify({phone,product,status})});
  alert("Ho gaya: " + status); load();
}
load();
</script></body></html>
